<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Rules — Cube Nishi Asakusa</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{--accent:#8a7060;--accent-light:#d8c8b8;--cream:#fff6f7;--text-dark:#2c0010;--text-mid:#6b1f30;}
  .lang-bar{display:flex;justify-content:center;gap:6px;padding:10px 16px;flex-wrap:wrap;background:var(--cream);}
  .lang-btn{border:2px solid var(--accent-light);background:rgba(255,255,255,0.92);border-radius:50px;padding:4px 9px;font-family:'Nunito',sans-serif;font-size:0.72rem;font-weight:800;color:var(--text-mid);cursor:pointer;transition:all 0.2s;box-shadow:0 2px 8px rgba(60,40,0,0.12);}
  .lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .lang-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);}
  .info-card{background:#fff;border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px;margin:16px 0;box-shadow:0 2px 10px rgba(60,40,0,0.10);}
  .info-card p{font-size:0.92rem;line-height:1.75;color:var(--text-mid);margin:0;}
  .info-card p+p{margin-top:8px;}
  .section-title{font-family:'Pacifico',cursive;font-size:1rem;color:var(--accent);margin-bottom:8px;}
  .rest-card{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 10px rgba(60,40,0,0.10);}
  .rest-card .rest-name{font-weight:800;font-size:0.97rem;color:var(--text-dark);margin-bottom:4px;}
  .rest-card .rest-desc{font-size:0.88rem;color:var(--text-mid);line-height:1.6;margin-bottom:6px;}
  .rest-card a{display:inline-flex;align-items:center;gap:5px;font-size:0.82rem;font-weight:700;color:var(--accent);text-decoration:none;}
  .rest-card a:hover{opacity:0.75;}
  .page-img{width:100%;border-radius:12px;margin:12px 0;box-shadow:0 2px 12px rgba(60,40,0,0.12);}
  .caption{background:#fff;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px;font-size:0.88rem;line-height:1.7;color:var(--text-mid);margin-bottom:16px;}
  .maps-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;padding:14px 28px;border-radius:50px;font-weight:800;font-size:1rem;margin:0 auto 20px;max-width:280px;box-shadow:0 4px 14px rgba(60,40,0,0.18);transition:opacity 0.2s;}
  .maps-btn:hover{opacity:0.85;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;}
  .top-bar{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,black) 100%);padding:16px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
  .back-btn{background:rgba(255,255,255,0.25);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;color:#fff;text-decoration:none;flex-shrink:0;transition:background 0.2s;}
  .back-btn:hover{background:rgba(255,255,255,0.4);}
  .top-title{font-family:'Pacifico',cursive;font-size:1.3rem;color:#fff;text-shadow:1px 2px 4px rgba(0,0,0,0.2);flex:1;}
  .top-emoji{font-size:1.8rem;}
  .content{padding:20px 16px 40px;max-width:640px;margin:0 auto;}
  .back-footer{text-align:center;margin-top:28px;padding-bottom:20px;}
  .back-footer a{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;padding:12px 28px;border-radius:50px;font-weight:800;font-size:0.9rem;transition:opacity 0.2s;}
  .back-footer a:hover{opacity:0.8;}
</style>
  <link rel="stylesheet" href="../assets/cute-pack.css">
  <style id="cute-pack-theme">:root{--cp-chip-a:#fff3e8;--cp-chip-b:#fdeef4;--cp-hover-shadow:rgba(220,140,90,.18);--cp-dot-1:rgba(240,170,120,.10);}</style>
</head>
<body>
<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('en',this)">&#x1F1EC;&#x1F1E7; EN</button>
  <button class="lang-btn" onclick="setLang('ja',this)">&#x1F1EF;&#x1F1F5; JA</button>
  <button class="lang-btn" onclick="setLang('zh',this)">&#x1F1E8;&#x1F1F3; ZH</button>
  <button class="lang-btn" onclick="setLang('ko',this)">&#x1F1F0;&#x1F1F7; KO</button>
  <button class="lang-btn" onclick="setLang('fr',this)">&#x1F1EB;&#x1F1F7; FR</button>
  <button class="lang-btn" onclick="setLang('es',this)">&#x1F1EA;&#x1F1F8; ES</button>
</div>
<div class="top-bar">
  <a href="../" class="back-btn">&#x2190;</a>
  <span class="top-emoji">📋</span>
  <div class="top-title" data-i18n="pageTitle">House Rules</div>
</div>
<div class="content">
  <div class="info-card">
    <p data-i18n="hr1"></p><p data-i18n="hr2"></p>
    <p data-i18n="hr3"></p><p data-i18n="hr4"></p>
    <p data-i18n="hr5"></p>
  </div>
  <div class="back-footer">
    <a href="../" data-i18n="backToMenu">&#x2190; Back to Menu</a>
  </div>
</div>
<script>
const S={
  en:{pageTitle:"House Rules",backToMenu:"← Back to Menu",
    hr1:"Check-in: 16:00 / Check-out: 10:00. Late check-out without notice may incur an extra cleaning fee.",
    hr2:"Quiet hours: 22:00–08:00. Please take off your shoes at the entrance.",
    hr3:"Smoking is strictly prohibited throughout the property, including all balconies. Please see the Smoking Rules page for details.",
    hr4:"Lock the door when sleeping or going out. Turn off all lights and A/C when you leave.",
    hr5:"If you lose or fail to return the key, a 20,000 yen charge applies. Damaged or severely soiled items may also be charged."},
  ja:{pageTitle:"ハウスルール",backToMenu:"← メニューに戻る",
    hr1:"チェックイン：16:00 / チェックアウト：10:00。事前連絡なしの遅延退室は清掃追加料金が発生する場合があります。",
    hr2:"静粛時間：22:00〜08:00。玄関で靴をお脱ぎください。",
    hr3:"室内・すべてのバルコニーを含め、全面禁煙です。詳細は喫煙ルールのページをご覧ください。",
    hr4:"就寝時・外出時はドアを施錠。外出時は照明・エアコンを必ずお切りください。",
    hr5:"鍵の紛失・未返却の場合は20,000円の費用が発生します。備品の損傷・著しい汚れも請求する場合があります。"},
  zh:{pageTitle:"入住规则",backToMenu:"← 返回菜单",
    hr1:"入住时间：16:00 / 退房时间：10:00。如未提前通知延迟退房，可能产生额外清洁费用。",
    hr2:"安静时间：22:00–08:00。入门请脱鞋。",
    hr3:"整个住宿场所全面禁烟，包括室内及所有阳台。详细说明请查看吸烟规则页面。",
    hr4:"入睡或外出时请锁门。离开时请关闭所有灯光和空调。",
    hr5:"如果丢失或未归还钥匙，将收取20,000日圆费用。备品损坏或严重弄脏也可能收费。"},
  ko:{pageTitle:"하우스 규정",backToMenu:"← 메뉴로 돌아가기",
    hr1:"체크인: 16:00 / 체크아웃: 10:00. 사전 연락 없이 늦게 체크아웃하면 추가 청소 비용이 발생할 수 있습니다.",
    hr2:"조용 시간: 22:00–08:00. 입구에서 신발을 벗어주세요.",
    hr3:"실내와 모든 발코니를 포함한 숙소 전체가 금연 구역입니다. 자세한 내용은 흡연 규정 페이지를 참고하세요.",
    hr4:"잠자거나 외출 시 문을 잠그세요. 외출 시 조명과 에어컨을 끄세요.",
    hr5:"열쇠 분실이나 반납 실패 시 20,000엔 비용이 발생합니다. 비품 손상이나 심한 오염 시도 청구될 수 있습니다."},
  fr:{pageTitle:"Règlement intérieur",backToMenu:"← Retour au menu",
    hr1:"Arrivée : 16h00 / Départ : 10h00. Un départ tardif sans préavis peut entraîner des frais supplémentaires.",
    hr2:"Heures calmes : 22h00–08h00. Veuillez enlever vos chaussures à l'entrée.",
    hr3:"Il est strictement interdit de fumer dans tout l'hébergement, y compris sur tous les balcons. Voir la page Règles fumeur pour les détails.",
    hr4:"Fermez à clé en dormant ou en sortant. Éteignez lumières et climatisation en partant.",
    hr5:"Perte ou non-restitution de la clé : 20 000 yens. Les objets endommagés ou très salis pourront être facturés."},
  es:{pageTitle:"Normas de la casa",backToMenu:"← Volver al menú",
    hr1:"Entrada: 16:00 / Salida: 10:00. Una salida tardía sin aviso puede generar cargos adicionales de limpieza.",
    hr2:"Horas tranquilas: 22:00–08:00. Quítese los zapatos en la entrada.",
    hr3:"Está estrictamente prohibido fumar en todo el alojamiento, incluidos todos los balcones. Consulte la página de normas para fumadores.",
    hr4:"Cierre con llave al dormir o salir. Apague las luces y el aire acondicionado al irse.",
    hr5:"Pérdida o no devolución de la llave: 20.000 yenes. Los artículos dañados o muy sucios también podrán facturarse."}
};
function setLang(l,btn){document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const t=S[l];if(!t)return;document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(k in t)el.textContent=t[k];});}
setLang('en',document.querySelector('.lang-btn.active'));
</script>
  <script src="../assets/cute-pack.js" defer></script>
</body>
</html>
