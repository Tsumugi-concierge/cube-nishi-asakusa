<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoking Rules — Cube Nishi Asakusa</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{--accent:#c03840;--accent-light:#f0c0c0;--cream:#fff6f7;--text-dark:#2c0010;--text-mid:#6b1f30;}
  .lang-bar{display:flex;justify-content:center;gap:6px;padding:10px 16px;flex-wrap:wrap;background:var(--cream);}
  .lang-btn{border:2px solid var(--accent-light);background:rgba(255,255,255,0.92);border-radius:50px;padding:4px 9px;font-family:'Nunito',sans-serif;font-size:0.72rem;font-weight:800;color:var(--text-mid);cursor:pointer;transition:all 0.2s;box-shadow:0 2px 8px rgba(60,40,0,0.12);}
  .lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .lang-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);}
  .info-card{background:#fff;border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px;margin:16px 0;box-shadow:0 2px 10px rgba(60,40,0,0.10);}
  .info-card p{font-size:0.92rem;line-height:1.75;color:var(--text-mid);margin:0;}
  .info-card p+p{margin-top:8px;}
  .section-title{font-family:'Pacifico',cursive;font-size:1rem;color:var(--accent);margin-bottom:8px;}
  .rest-card{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 10px rgba(60,40,0,0.10);}
  .rest-card .rest-name{font-weight:800;font-size:0.97rem;color:var(--text-dark);margin-bottom:4px;}
  .rest-card .rest-desc{font-size:0.88rem;color:var(--text-mid);line-height:1.6;margin-bottom:6px;}
  .rest-card a{display:inline-flex;align-items:center;gap:5px;font-size:0.82rem;font-weight:700;color:var(--accent);text-decoration:none;}
  .rest-card a:hover{opacity:0.75;}
  .page-img{width:100%;border-radius:12px;margin:12px 0;box-shadow:0 2px 12px rgba(60,40,0,0.12);}
  .caption{background:#fff;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px;font-size:0.88rem;line-height:1.7;color:var(--text-mid);margin-bottom:16px;}
  .maps-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;padding:14px 28px;border-radius:50px;font-weight:800;font-size:1rem;margin:0 auto 20px;max-width:280px;box-shadow:0 4px 14px rgba(60,40,0,0.18);transition:opacity 0.2s;}
  .maps-btn:hover{opacity:0.85;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;}
  .top-bar{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,black) 100%);padding:16px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
  .back-btn{background:rgba(255,255,255,0.25);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;color:#fff;text-decoration:none;flex-shrink:0;transition:background 0.2s;}
  .back-btn:hover{background:rgba(255,255,255,0.4);}
  .top-title{font-family:'Pacifico',cursive;font-size:1.3rem;color:#fff;text-shadow:1px 2px 4px rgba(0,0,0,0.2);flex:1;}
  .top-emoji{font-size:1.8rem;}
  .content{padding:20px 16px 40px;max-width:640px;margin:0 auto;}
  .back-footer{text-align:center;margin-top:28px;padding-bottom:20px;}
  .back-footer a{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;padding:12px 28px;border-radius:50px;font-weight:800;font-size:0.9rem;transition:opacity 0.2s;}
  .back-footer a:hover{opacity:0.8;}
</style>
</head>

<script>
const S={
  en:{pageTitle:"Smoking Rules",backToMenu:"← Back to Menu",
    sm1:"Smoking is STRICTLY PROHIBITED inside the property. Any indoor smoking will require special cleaning and a fee of 20,000 yen will be charged.",
    sm2:"Smoking is only permitted on the 3rd-floor balcony. Please dispose of cigarette butts properly in the ashtray provided.",
    sm3:"This accommodation is operated with the understanding of our neighbors. Failure to follow smoking rules may result in being asked to leave. Please be considerate, especially late at night."},
  ja:{pageTitle:"喫煙ルール",backToMenu:"← メニューに戻る",
    sm1:"室内での喫煙は厳禁です。室内で喫煙が発覚した場合、特別清掃として20,000円の費用が請求されます。",
    sm2:"喫煙できる場所は3階バルコニーのみです。吸い殻は必ず備え付けの灰皿に捨ててください。",
    sm3:"この宿泊施設は近隣の理解のもとで運営されています。喫煙ルールに従わない場合は退去をお願いすることがあります。特に深夜の大声はご遠慮ください。"},
  zh:{pageTitle:"吸烟规定",backToMenu:"← 返回菜单",
    sm1:"房内严禁吸烟。如发现室内吸烟，将收取20,000日圆特别清洁费用。",
    sm2:"只允许在3楼阳台吸烟，请将烟蒂正确处理到提供的烟灰缸中。",
    sm3:"本住宿是在邻居的理解下运营的。不遵守吸烟规定可能被要求离开。请特别注意深夜不要大声说话。"},
  ko:{pageTitle:"흡연 규정",backToMenu:"← 메뉴로 돌아가기",
    sm1:"실내 흡연은 엄격히 금지됩니다. 실내에서 흡연 시 특별 청소 비용으로 20,000엔이 청구됩니다.",
    sm2:"흡연은 3층 발코니에서만 허용됩니다. 담배꽁초는 제공된 재떨이에 제대로 처리해 주세요.",
    sm3:"이 숙소는 이웃의 이해 하에 운영됩니다. 흡연 규정을 따르지 않으면 퇴실을 요청할 수 있습니다. 특히 심야에는 큰 소리를 자제해 주세요."},
  fr:{pageTitle:"Règles fumeur",backToMenu:"← Retour au menu",
    sm1:"Il est STRICTEMENT INTERDIT de fumer à l'intérieur. Tout fumage en intérieur entraînera un nettoyage spécial et des frais de 20 000 yens.",
    sm2:"Fumer est uniquement autorisé sur le balcon du 3e étage. Veuillez jeter les mégots dans le cendrier fourni.",
    sm3:"Cet hébergement fonctionne avec la compréhension du voisinage. Le non-respect peut entraîner une expulsion. Soyez courtois, surtout la nuit."},
  es:{pageTitle:"Normas para fumadores",backToMenu:"← Volver al menú",
    sm1:"Fumar dentro de la propiedad está ESTRICTAMENTE PROHIBIDO. Cualquier caso de fumado interior conllevará limpieza especial y un cargo de 20.000 yenes.",
